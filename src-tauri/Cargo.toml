[package]
name = "quorum"
version = "0.1.0"
description = "A native macOS harness for software work"
authors = ["Quorum"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "quorum_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "quorum"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "=0.35.0", features = ["bundled"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
shell-words = "=1.1.0"
tauri = { version = "=2.6.2", features = ["macos-private-api"] }
tauri-plugin-dialog = "=2.2.1"
tauri-plugin-opener = "=2.2.7"
tauri-runtime = "=2.9.2"
wry = "=0.53.4"
thiserror = "=2.0.12"
ts-rs = { version = "=10.1.0", features = ["chrono-impl"] }
uuid = { version = "=1.16.0", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "=1.0.140"
tempfile = "=3.20.0"

[lints.rust]
unsafe_code = "forbid"
unused = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
