      <stop offset="0%" stop-color="#2E5FE8"/>
      <stop offset="100%" stop-color="#5FD4F0"/>
    </linearGradient>
  </defs>
  <rect x="172" y="182" width="320" height="320" rx="56" fill="#101A4D"/>
  <g fill="none" stroke="url(#ringGrad)" stroke-linecap="round">
    <circle cx="316" cy="326" r="97" stroke-width="8"/>
    <circle cx="347" cy="327" r="92" stroke-width="8"/>
    <circle cx="330" cy="350" r="98" stroke-width="8"/>
  </g>
  <circle cx="340" cy="340" r="61" fill="#101A4D"/>
